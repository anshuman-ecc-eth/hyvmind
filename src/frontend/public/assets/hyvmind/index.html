<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HYVMIND</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; touch-action: none; color-scheme: dark; }
  body { font-family: monospace; display: flex; align-items: center; justify-content: center; }
  body:focus { outline: none; }


  /* ── Layout (desktop) ── */
  .layout { display: flex; align-items: center; gap: 24px; }
  .dpad { position: relative; width: 144px; height: 150px; flex-shrink: 0; }
  .dpad-btn { position: absolute; width: 46px; height: 46px; background: rgba(255,255,255,0.5); border: none; border-radius: 6px; color: #000; font-family: 'Press Start 2P', monospace; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; transition: transform 0.15s; box-shadow: -3px 0 0 0 #666, 3px 0 0 0 #666, 0 -3px 0 0 #666, 0 3px 0 0 #666; }
  .dpad-btn:active, .dpad-btn.active { background: #fff3d4; color: #c89420; transform: translateY(3px); box-shadow: -2px 0 0 0 #c89420, 2px 0 0 0 #c89420, 0 -2px 0 0 #c89420, 0 2px 0 0 #c89420; }
  .dpad-up    { top: 0; left: 49px; }
  .dpad-down  { bottom: 0; left: 49px; }
  .dpad-left  { left: 0; top: 52px; }
  .dpad-right { right: 0; top: 52px; }
  .action-buttons { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 144px; height: 150px; padding-top: 24px; }
  .action-row { display: flex; flex-direction: row; gap: 16px; }
  .action-btn { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.5); border: none; color: #000; font-family: 'Press Start 2P', monospace; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; transition: transform 0.15s; box-shadow: -3px 0 0 0 #666, 3px 0 0 0 #666, 0 -3px 0 0 #666, 0 3px 0 0 #666; position: relative; }
  .action-btn:active, .action-btn.active { background: #fff3d4; color: #c89420; transform: translateY(3px); box-shadow: -2px 0 0 0 #c89420, 2px 0 0 0 #c89420, 0 -2px 0 0 #c89420, 0 2px 0 0 #c89420; }
  .zoom-row { display: flex; flex-direction: row; gap: 6px; width: 100%; margin-top: 25px; }
  .screen-size-btn { display: flex; align-items: center; justify-content: center; padding: 6px 10px; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #000; background: rgba(255,255,255,0.5); border: none; border-radius: 6px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; white-space: nowrap; width: 100%; transition: transform 0.15s; box-shadow: -3px 0 0 0 #666, 3px 0 0 0 #666, 0 -3px 0 0 #666, 0 3px 0 0 #666; position: relative; }
  .screen-size-btn:active, .screen-size-btn.active { background: #fff3d4; color: #c89420; transform: translateY(3px); box-shadow: -2px 0 0 0 #c89420, 2px 0 0 0 #c89420, 0 -2px 0 0 #c89420, 0 2px 0 0 #c89420; }
   .top-btn { display:flex;align-items:center;justify-content:center;padding:6px 10px;font-family:'Press Start 2P',monospace;font-size:8px;color:#000;background:rgba(255,255,255,0.5);border:none;border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;white-space:nowrap;transition:transform 0.15s;box-shadow:-3px 0 0 0 #666,3px 0 0 0 #666,0 -3px 0 0 #666,0 3px 0 0 #666;position:relative; }
   .top-btn:active,.top-btn.active { background:#fff3d4;color:#c89420;transform:translateY(3px);box-shadow:-2px 0 0 0 #c89420,2px 0 0 0 #c89420,0 -2px 0 0 #c89420,0 2px 0 0 #c89420; }
   .dpad-btn::after, .action-btn::after, .screen-size-btn::after, .top-btn::after { content: ""; position: absolute; bottom: 0; right: 0; width: 100%; height: 100%; pointer-events: none; border-right: 3px solid rgba(0,0,0,0.15); border-bottom: 3px solid rgba(0,0,0,0.15); border-radius: inherit; }

  .game-container { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; }
  .layout { display: flex; flex-direction: column; align-items: center; width: fit-content; flex-shrink: 0; padding: 16px; border-radius: 4px; }
  .layout-row { display: flex; align-items: center; gap: 24px; }
  .screen { width: 500px; height: 500px; overflow: hidden; position: relative; box-shadow: 0 0 60px rgba(0,0,0,0.9); flex-shrink: 0; }
  .viewport { position: absolute; inset: 0; overflow: hidden; image-rendering: pixelated; }
  .world-layer { display: block; image-rendering: pixelated; position: absolute; top: 0; left: 0; }
  .game-layer { position: absolute; inset: 0; z-index: 1; }
  .sprite { position: absolute; left: 0; top: 0; width: 32px; height: 36px; background-size: 32px 36px; image-rendering: pixelated; pointer-events: none; background-repeat: no-repeat; z-index: 5; will-change: transform; }
.player-wrapper { position: absolute; left: 0; top: 0; width: 38px; height: 42px; pointer-events: none; z-index: 5; will-change: transform; }
.player-sprite { position: absolute; left: 0; top: 0; width: 38px; height: 42px; background-size: 38px 42px; image-rendering: pixelated; pointer-events: none; background-repeat: no-repeat; }
</style>
</head>
<body tabindex="-1">

<div id="gameContainer" class="game-container">
  <div class="layout" id="gameLayout">
    <button id="settingsBtn" class="top-btn" style="margin-bottom:12px">Settings</button>
    <div class="layout-row">
      <div class="dpad">
        <button class="dpad-btn dpad-up"    data-dir="up">W</button>
        <button class="dpad-btn dpad-down"  data-dir="down">S</button>
        <button class="dpad-btn dpad-left"  data-dir="left">A</button>
        <button class="dpad-btn dpad-right" data-dir="right">D</button>
      </div>
      <div class="screen">
        <div class="viewport" id="viewport">
          <img id="worldBg" class="world-layer" src="/assets/hyvmind/bottom.png">
          <div id="gameLayer" class="game-layer"></div>
        </div>
      </div>
      <div class="action-buttons">
        <div class="action-row">
          <button class="action-btn" id="btnZ">J</button>
          <button class="action-btn" id="btnX">K</button>
        </div>
        <div class="zoom-row">
          <button class="screen-size-btn" id="rollBtn">Roll</button>
        </div>
      </div>
    </div>
    <button id="backBtn" type="button" style="margin-top:5px;font-family:'Press Start 2P',monospace;font-size:0.6rem;letter-spacing:0.15em;background:none;border:none;cursor:pointer;padding:0;color:#ffffff;transition:color 0.15s" onmouseenter="this.style.color='#7a6a4a'" onmouseleave="this.style.color='#ffffff'" onfocus="this.style.color='#7a6a4a'" onblur="this.style.color='#ffffff'">&gt; Back</button>
  </div>
</div>

<audio id="bgm" src="/assets/hyvmind/forest.mp3" loop preload="auto"></audio>
<script>
var ASSETS = '/assets/hyvmind';
var WORLD_W = 574, WORLD_H = 2176;
var SCREEN_W = 550, SCREEN_H = 480;
var gameZoom = 2;
var TILE = 8;
var COLS = 72, ROWS = 272;
function luaUrl(anim, dir, frame) { return 'url(' + ASSETS + '/sprites/lua_' + anim + '_' + dir + '_' + frame + '.png)'; }
function animDir(pDir) { return pDir === 3 ? 'u' : 'd'; }
function isFlipped(pDir) { return pDir === 1; }

var gamePaused = false;

var currentScore = 0;
var storedSecrets = [];
var isGenerating = false;
var activeMenu = null;
var menuSelected = 0;
var secretsScroll = 0;

// ── Boat / ferry constants ──
var BOAT_SHEET = ASSETS + '/sprites/rowboat.png';
var BOAT_FRAME_W = 73, BOAT_FRAME_H = 73;
var BOAT_SPRITESHEET_W = 192, BOAT_SPRITESHEET_H = 160;
var BOAT_SOUTH_X = 1, BOAT_SOUTH_Y = 17;
var BOAT_NORTH_X = 98, BOAT_NORTH_Y = 17;
var BOAT_TILE_SIZE = 8;
var BOAT_STEP = 3; // pixels per tick when driving
var BOAT_LR_W = 146, BOAT_LR_H = 53; // left/right frame size
var BOAT_UP_W = 52, BOAT_UP_H = 145;
var BOAT_DOWN_W = 52, BOAT_DOWN_H = 145;

var boatX = 160, boatY = 160;
var boatEl = null;
var isRiding = false;
var boatTerminalCenter = null;
var boatTriggerKeys = {};
var boatBlockedTiles = {};

window.addEventListener('message', function(e) {
  if (e.data?.type === 'hyvmind-resume') { console.log('RESUME received'); gamePaused = false; navPaused = false; document.body.focus(); }
  if (e.data?.type === 'hyvmind-focus') { requestAnimationFrame(function() { document.body.focus(); }); }
  if (e.data?.type === 'hyvmind-score-update') { currentScore = e.data.score || 0; }
  if (e.data?.type === 'hyvmind-popup') {
    if (e.data?.msg) showPopup(e.data.msg);
  }
  if (e.data?.type === 'hyvmind-generating') {
    isGenerating = true;
    activeMenu = 'loading';
    closePopup();
  var pop = document.createElement('div');
  pop.style.cssText = 'position:absolute;left:0;right:0;bottom:0;z-index:9999;pointer-events:auto;';
    pop.innerHTML = '<div style="background:#0a0a0a;padding:8px 12px;text-align:center;font-family:VT323,monospace;color:#e0e0e0;font-size:30px;">Generating secret..</div>';
    (document.querySelector('.screen') || document.body).appendChild(pop);
  activePopup = pop;
}
  if (e.data?.type === 'hyvmind-pause-bgm') {
    if (typeof bgm !== 'undefined' && bgm) { bgm.pause(); bgm.currentTime = 0; }
  }
  if (e.data?.type === 'hyvmind-resume-bgm') {
    if (typeof bgm !== 'undefined' && bgm) { bgm.currentTime = 0; bgm.play().catch(function(){}); }
  }

function showGangeshUpadhyayDialog() {
  if (activePopup) activePopup.remove();
  var pop = document.createElement('div');
  pop._type = 'gangesh-upadhyay';
  pop._step = 0; // 0 = menu, 1+ = showing response to that index
  pop._selected = 0;
  pop.style.cssText = 'position:absolute;left:0;right:0;bottom:0;z-index:9999;pointer-events:auto;';
  renderGangeshUpadhyayPopup(pop);
  (document.querySelector('.screen') || document.body).appendChild(pop);
  activePopup = pop;
}

function renderGangeshUpadhyayPopup(pop) {
  if (pop._step === 0) {
    renderGangeshUpadhyayMenu(pop);
  } else {
    renderGangeshUpadhyayResponse(pop);
  }
}

function renderGangeshUpadhyayMenu(pop) {
  var sel = pop._selected;
  var items = '';
  for (var i = 0; i < GANGESH_UPADHYAY_DIALOGS.length; i++) {
    var arrow = i === sel ? '>' : '&nbsp;';
    var cls = i === sel ? '#e0e0e0' : '#888';
    var op = i === sel ? '' : 'opacity:0.5;';
    menuItems += '<div style="font-size:13px;color:' + cls + ';' + op + 'text-align:left;padding:4px 8px;">' + arrow + ' ' + GANGESH_UPADHYAY_DIALOGS[i].question + '</div>';
  }
  pop.innerHTML = '<div style="background:#0a0a0a;padding:8px 12px;font-family:VT323,monospace;color:#e0e0e0;font-size:28px;line-height:1.4;"><div style="text-align:center;color:#e0e0e0;font-size:30px;margin-bottom:2px;">~ Gangesa ~</div><div style="text-align:center;font-size:22px;color:#888;margin-bottom:2px;">Ask me anything:</div>' + items + '<div style="margin-top:5px;padding-top:4px;border-top:1px solid #333;text-align:center;font-size:24px;color:#666;">[J] select  [K] close</div></div>';
}

function renderGangeshUpadhyayResponse(pop) {
  var idx = pop._step - 1;
  var response = idx >= 0 && idx < GANGESH_UPADHYAY_DIALOGS.length ? GANGESH_UPADHYAY_DIALOGS[idx].response : '';
  var question = idx >= 0 && idx < GANGESH_UPADHYAY_DIALOGS.length ? GANGESH_UPADHYAY_DIALOGS[idx].question : '';
  pop.innerHTML = '<div style="background:#0a0a0a;padding:8px 12px;text-align:center;font-family:VT323,monospace;color:#e0e0e0;font-size:28px;line-height:1.4;"><div style="color:#888;font-size:22px;margin-bottom:5px;">~ ' + question + ' ~</div><div style="padding:3px 0;">' + response + '</div><div style="margin-top:5px;padding-top:4px;border-top:1px solid #333;font-size:24px;color:#666;">[J] back  [K] close</div></div>';
}
  if (e.data?.type === 'hyvmind-buzz-secret') {
    isGenerating = false;
    if (e.data.secret) storedSecrets.push({ secret: e.data.secret, score: e.data.score || 0 });
  closePopup();
    showSecretsMenu();
  }
});

var dirMap = [2, 3, 1, 0];
var dirMap = [2, 3, 1, 0];
var dirMap = [2, 3, 1, 0];
var collisionMap = [];
for (var y = 0; y < ROWS; y++) { collisionMap[y] = []; for (var x = 0; x < COLS; x++) collisionMap[y][x] = 1; }

function initCollision(callback) {
  var img = new Image();
  img.onload = function() {
    try {
      var c = document.createElement('canvas');
      c.width = COLS; c.height = ROWS;
      var cx = c.getContext('2d', { willReadFrequently: true });
      cx.drawImage(img, 0, 0);
      var data = cx.getImageData(0, 0, COLS, ROWS).data;
      for (var y = 0; y < ROWS; y++)
        for (var x = 0; x < COLS; x++) {
          var idx = (y * COLS + x) * 4;
          var r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
          if (a === 0) collisionMap[y][x] = 0;
          else if (r > 150 && b > 150 && g < 150) collisionMap[y][x] = 4;
          else if (g > 150 && b > 150 && r < 150) collisionMap[y][x] = 5;
          else if (g > 150 && r < 150) collisionMap[y][x] = 1;
          else if (b > 150 && r < 150 && g < 150) collisionMap[y][x] = 6;
          else collisionMap[y][x] = 0;
        }
    } catch(e) { console.error('initCollision error:', e); }
    callback();
  };
  img.onerror = function() { console.error('initCollision img load failed'); callback(); };
  img.src = ASSETS + '/collision.png';
}

var triggerMessages = {};
var triggerPositions = [];
var lastTriggerTile = null;
var doorLabels = {};
var doorPositions = [];
var nearDoor = null;

function scanBoatTriggers() {
  boatTriggerKeys = {};
  boatBlockedTiles = {};
  boatTerminalCenter = null;
  var t1sumX = 0, t1sumY = 0, t1c = 0;
  var blockedKeys = [];
  for (var key in triggerMessages) {
    var msg = triggerMessages[key];
    if (msg === 'boat terminal 1') {
      boatTriggerKeys[key] = true;
      var parts = key.split(',');
      t1sumX += parseInt(parts[0]); t1sumY += parseInt(parts[1]); t1c++;
    } else if (msg === 'boat terminal 2') {
      boatTriggerKeys[key] = true;
    } else if (msg === 'blocked') {
      boatBlockedTiles[key] = true;
      blockedKeys.push(key);
    }
  }
  // Remove blocked entries from triggerMessages so no sparkles or Z dialogs
  for (var i = 0; i < blockedKeys.length; i++) {
    delete triggerMessages[blockedKeys[i]];
  }
  if (t1c > 0) {
    boatTerminalCenter = {tx: Math.round(t1sumX / t1c), ty: Math.round(t1sumY / t1c)};
  }
}

function loadTriggers(callback) {
  fetch(ASSETS + '/triggers.json')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      triggerMessages = d || {};
      triggerPositions = [];
      var cmap = {};
      for (var y = 0; y < ROWS; y++)
        for (var x = 0; x < COLS; x++)
          if (collisionMap[y][x] === 4) { triggerPositions.push({tx: x, ty: y, key: x+','+y}); cmap[x+','+y] = true; }
      for (var key in triggerMessages) {
        if (!cmap[key]) {
          var parts = key.split(',');
          triggerPositions.push({tx: parseInt(parts[0]), ty: parseInt(parts[1]), key: key});
        }
      }
    })
    .catch(function() { triggerMessages = {}; triggerPositions = []; })
    .then(function() {
      fetch(ASSETS + '/doors.json')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          doorLabels = d || {};
          doorPositions = [];
          for (var y = 0; y < ROWS; y++)
            for (var x = 0; x < COLS; x++)
              if (collisionMap[y][x] === 6) doorPositions.push({tx: x, ty: y, key: x+','+y});
          scanBoatTriggers();
          callback();
        })
        .catch(function() { doorLabels = {}; doorPositions = []; callback(); });
    });
}

function checkNearbyTriggers(gx, gy) {
  var tx = Math.floor((gx + 19) / TILE);
  var ty = Math.floor((gy + 16) / TILE);
  nearTrigger = null;
  nearDoor = null;
  var bestDist = 999;
  for (var i = 0; i < triggerPositions.length; i++) {
    var tp = triggerPositions[i];
    if (triggerMessages[tp.key]) {
      var dist = Math.abs(tp.tx - tx) + Math.abs(tp.ty - ty);
      if (dist < bestDist) { bestDist = dist; nearTrigger = tp; }
    }
  }
  if (bestDist > 3) nearTrigger = null;
  var doorDist = 999;
  for (var i = 0; i < doorPositions.length; i++) {
    var dp = doorPositions[i];
    var dist = Math.abs(dp.tx - tx) + Math.abs(dp.ty - ty);
    if (dist < doorDist) { doorDist = dist; nearDoor = dp; }
  }
  if (doorDist > 3) nearDoor = null;
}

var activePopup = null;
var triggerMemory = {};
function showPopup(msg) {
  if (activePopup) { if (activePopup._type !== 'door') activePopup.remove(); else return; }
  // If message starts with >>, show input popup instead
  if (msg === 'trunk' || msg === '>>trunk') { showTrunkPopup(); return; }
  if (msg.indexOf('>>') === 0) { showInputPopup(msg); return; }
  var pop = document.createElement('div');
  pop._dismissKey = 'msg:' + msg;
  pop.style.cssText = 'position:absolute;left:0;right:0;bottom:0;z-index:9999;pointer-events:auto;';
  pop.innerHTML = '<div style="background:#0a0a0a;padding:8px 12px;text-align:center;font-family:VT323,monospace;color:#e0e0e0;font-size:28px;line-height:1.4;">' + msg + '<div style="margin-top:6px;padding-top:5px;border-top:1px solid #333;text-align:center;font-size:24px;color:#666;">[K] close</div></div>';
  (document.querySelector('.screen') || document.body).appendChild(pop);
  activePopup = pop;
}
function showDefaultPopup() {
  if (activePopup) { if (activePopup._type !== 'door') activePopup.remove(); else return; }
  var pop = document.createElement('div');
  pop.style.cssText = 'position:absolute;left:0;right:0;bottom:0;z-index:9999;pointer-events:auto;';
  var scoreHtml = '<div style="color:#888;padding:0 0 8px 0;border-bottom:1px solid #333;margin-bottom:2px;">Score: ' + currentScore + '</div>';
  pop.innerHTML = '<div style="background:#0a0a0a;padding:8px 12px;text-align:center;font-family:VT323,monospace;color:#e0e0e0;font-size:28px;line-height:1.4;">' + scoreHtml + '<div style="margin-bottom:2px;">who am I talking to?</div><div style="margin-top:6px;padding-top:5px;border-top:1px solid #333;text-align:center;font-size:24px;color:#666;">[K] close</div></div>';
  (document.querySelector('.screen') || document.body).appendChild(pop);
  activePopup = pop;
}
function showInputPopup(raw) {
  var lines = raw.split('\n');
  var question = lines[0].slice(2);
  var rules = [];
  for (var i = 1; i < lines.length; i++) {
    var idx = lines[i].indexOf('->');
    if (idx !== -1) {
      rules.push({ pattern: lines[i].slice(0, idx).trim().toLowerCase(), response: lines[i].slice(idx + 2).trim() });
    }
  }
  // If memory exists for this key, show stored response instead
  var triggerKey = nearTrigger ? nearTrigger.key : null;
  if (triggerKey && triggerMemory[triggerKey]) {
    showPopup(triggerMemory[triggerKey]);
    return;
  }
  if (activePopup) activePopup.remove();
  var pop = document.createElement('div');
  pop._type = 'input';
  pop._dismissKey = 'msg:' + raw;
  pop._rules = rules;
  pop._triggerKey = triggerKey;
  pop.style.cssText = 'position:absolute;left:0;right:0;bottom:0;z-index:9999;pointer-events:auto;';
  pop.innerHTML = '<div style="background:#0a0a0a;padding:8px 12px;text-align:center;font-family:VT323,monospace;color:#e0e0e0;font-size:28px;line-height:1.4;">' + question + '<input id="inputField" type="text" style="display:block;margin:12px auto 0;width:80%;background:#111;border:1px solid #444;color:#e0e0e0;font-family:VT323,monospace;font-size:28px;padding:2px 4px;outline:none;text-align:center;"><div style="margin-top:5px;padding-top:4px;border-top:1px solid #333;text-align:center;font-size:24px;color:#666;">[Enter] submit  [K] cancel</div></div>';
  (document.querySelector('.screen') || document.body).appendChild(pop);
  activePopup = pop;
  // Focus the input field after a delay for Firefox
  setTimeout(function() { var f = document.getElementById('inputField'); if (f) f.focus(); }, 50);
}
function submitInput() {
  if (!activePopup || activePopup._type !== 'input') return;
  var input = document.getElementById('inputField');
  var val = input ? input.value.trim().toLowerCase() : '';
  var rules = activePopup._rules;
  var triggerKey = activePopup._triggerKey;
  var response = null;
  for (var i = 0; i < rules.length; i++) {
    if (rules[i].pattern === '*') { response = rules[i].response; break; }
    if (val.indexOf(rules[i].pattern) !== -1) { response = rules[i].response; break; }
  }
  if (!response) response = 'I don\'t understand.';
  if (triggerKey) triggerMemory[triggerKey] = response;
  showPopup(response);
  if (triggerKey && response.indexOf('Correct') !== -1) {
    window.parent.postMessage({ type: 'hyvmind-submit-score' }, '*');
  }
}
function showDoorPopup(label) {
  if (activePopup && activePopup._type === 'door') return;
  if (activePopup) activePopup.remove();
  var pop = document.createElement('div');
  pop._type = 'door';
  pop._label = label;
  if (nearDoor) pop._dismissKey = 'door:' + (label || 'unlabeled');
  pop.style.cssText = 'position:absolute;left:0;right:0;bottom:0;z-index:9999;pointer-events:auto;';
  var title = label ? '~ ' + label + ' ~' : '~ door ~';

function isWalkable(gx, gy) {
  var tx = Math.floor((gx + 19) / TILE);
  var ty = Math.floor((gy + 16) / TILE);
  if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return false;
  var v = collisionMap[ty][tx];
  return v === 1 || v === 5;
}

function findNearestWalkable(gx, gy) {
  var tx = Math.floor((gx + 19) / TILE);
  var ty = Math.floor((gy + 16) / TILE);
  for (var r = 0; r < 200; r++) {
    for (var dy = -r; dy <= r; dy++) {
      for (var dx = -r; dx <= r; dx++) {
        if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        var nx = tx + dx, ny = ty + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        var v = collisionMap[ny][nx];
        if (v === 1) {
          return { x: nx * TILE + 4 - 16, y: ny * TILE + 4 - 14 };
        }
      }
    }
  }
  return { x: gx, y: gy };
}

  elP.style.opacity = isUnderObject ? '0.4' : '1';

  var t = Date.now() / 300;
  for (var s = 0; s < sparkles.length; s++) {
    if ((nearTrigger && triggerMessages[nearTrigger.key]) || nearDoor) {
      var angle = t * sparkleSpeeds[s] + sparklePhases[s];
      var hue = (sparkleHues[s] + t * 40) % 360;
      sparkles[s].style.left = (px - camX + 19 + Math.cos(angle) * sparkleRadii[s]) + 'px';
      sparkles[s].style.top = (py - camY + 21 + Math.sin(angle) * sparkleRadii[s]) + 'px';
      sparkles[s].style.background = 'hsl(' + hue + ', 100%, 70%)';
      sparkles[s].style.boxShadow = '0 0 ' + (sparkleSizes[s] + 4) + 'px hsl(' + hue + ', 100%, 55%)';
      sparkles[s].style.opacity = 0.7 + 0.3 * Math.sin(angle * 2.5);
    } else {
      sparkles[s].style.opacity = 0;
    }
  }
  // Door popups only show on Z press, not automatically
  if (!nearDoor) {
    closeDoorPopup();
  }
}

document.addEventListener('keyup', function(e) {
  if (e.key.startsWith('Arrow')) {
    var dir = e.key.slice(5).toLowerCase();
    var btn = document.querySelector('.dpad-btn.dpad-' + dir);
    if (btn) { btn.classList.remove('active'); dpadState[dir] = false; }
  }
  if (e.key === 'w' || e.key === 'W') { var b = document.querySelector('.dpad-btn.dpad-up'); if (b) { b.classList.remove('active'); dpadState['up'] = false; } }
  if (e.key === 's' || e.key === 'S') { var b = document.querySelector('.dpad-btn.dpad-down'); if (b) { b.classList.remove('active'); dpadState['down'] = false; } }
  if (e.key === 'a' || e.key === 'A') { var b = document.querySelector('.dpad-btn.dpad-left'); if (b) { b.classList.remove('active'); dpadState['left'] = false; } }
  if (e.key === 'd' || e.key === 'D') { var b = document.querySelector('.dpad-btn.dpad-right'); if (b) { b.classList.remove('active'); dpadState['right'] = false; } }
});

var dpadState = {};
document.querySelectorAll('.dpad-btn').forEach(function(btn) {
  function start(e) { e.preventDefault(); btn.classList.add('active'); if (!navigatePopup(btn.dataset.dir, true)) { dpadState[btn.dataset.dir] = true; lastDir = btn.dataset.dir; } }
  function end(e) { e.preventDefault(); btn.classList.remove('active'); dpadState[btn.dataset.dir] = false; }
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', end, { passive: false });
  btn.addEventListener('touchcancel', end, { passive: false });
});

document.getElementById('btnZ').addEventListener('click', function() {
  this.classList.add('active');
  activateZ();
  setTimeout(function() { this.classList.remove('active'); }.bind(this), 150);
});
document.getElementById('btnX').addEventListener('click', function() {
  this.classList.add('active');
  if (activePopup && activePopup._type === 'door') doorDismissed = true;
  if (activePopup && activePopup._type === 'secrets') { closePopup(); menuSelected = 0; secretsScroll = 0; activeMenu = null; }
  else if (activePopup && activePopup._type === 'view-secrets') { closePopup(); activeMenu = 'secrets'; showSecretsMenu(); }
  else if (activePopup && (activePopup._type === 'startup' || activePopup._type === 'welcome')) { closePopup(); gamePaused = false; }
  else { closePopup(); }
  setTimeout(function() { this.classList.remove('active'); }.bind(this), 150);
});

document.getElementById('backBtn').addEventListener('click', function() {
  window.parent.postMessage({ type: 'hyvmind-close' }, '*');
});

// Screen size toggle
var zoomValues = [1, 1.25, 1.5];
var zoomLabels = ['100%', '125%', '150%'];
var zoomIdx = 0;
var layoutEl = document.querySelector('.layout');
// Restore persisted zoom
var savedZoom = localStorage.getItem('hyvmind-zoom');
if (savedZoom !== null) {
  var idx = zoomValues.indexOf(parseFloat(savedZoom));
  if (idx >= 0) {
    zoomIdx = idx;
    layoutEl.style.transform = 'scale(' + savedZoom + ')';
  }
}
// Listen for zoom changes from terrain world
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'hyvmind-set-zoom') {
    var val = e.data.zoom;
    var idx = zoomValues.indexOf(parseFloat(val));
    if (idx >= 0) {
      zoomIdx = idx;
      layoutEl.style.transform = 'scale(' + val + ')';
    }
  }
});

var tick = 0;
function loop() {
  if (navPaused) {
    render(); renderNPC(); renderBoat();
    navPauseTick++;
    if (navPauseTick > 40) { navPaused = false; console.log('navPaused fallback timeout'); }
    return;
  }
  if (gamePaused) { render(); renderNPC(); renderBoat(); return; }
  tick++;
  if (isRiding) {
    // Player drives the boat with dpad; sync player direction
    var bdx = 0, bdy = 0;
    if (dpadState['left']) { bdx = -BOAT_STEP; pDir = 1; }
    else if (dpadState['right']) { bdx = BOAT_STEP; pDir = 2; }
    else if (dpadState['up']) { bdy = -BOAT_STEP; pDir = 3; }
    else if (dpadState['down']) { bdy = BOAT_STEP; pDir = 0; }
    if (bdx !== 0 || bdy !== 0) {
      var nbx = boatX + bdx, nby = boatY + bdy;
      // Check if the tile at the boat's center is blocked
      var centerIsBlocked = function(gx, gy) {
        var tx2 = Math.floor((gx + BOAT_FRAME_W/2) / TILE);
        var ty2 = Math.floor((gy + BOAT_FRAME_H/2) / TILE);
        if (tx2 < 0 || tx2 >= COLS || ty2 < 0 || ty2 >= ROWS) return true;
        var k = tx2+','+ty2;
        if (collisionMap[ty2][tx2] === 1) {
          return !(boatTriggerKeys[k] && (triggerMessages[k] === 'boat terminal 1' || triggerMessages[k] === 'boat terminal 2'));
        }
        if (boatBlockedTiles[k]) return true;
        return false;
      };
      if (bdx !== 0) {
        var nbx = boatX + bdx;
        if (!centerIsBlocked(nbx, boatY)) boatX = nbx;
      }
      if (bdy !== 0) {
        var nby = boatY + bdy;
        if (!centerIsBlocked(boatX, nby)) boatY = nby;
      }
    }
    boatX = Math.max(0, Math.min(WORLD_W - BOAT_FRAME_W, boatX));
    boatY = Math.max(0, Math.min(WORLD_H - BOAT_FRAME_H, boatY));
    px = boatX + Math.floor(BOAT_FRAME_W/2) - 19;
    py = boatY + Math.floor(BOAT_FRAME_H/2) - 37;
  } else {
    if (pRolling) {
      var nx = px + rollVx, ny = py + rollVy;
      var bc = function(gx,gy){var t=Math.floor((gx+19)/8),u=Math.floor((gy+16)/8);return (t===npcTileX&&u===npcTileY)||(t===Math.floor((udx+19)/8)&&u===Math.floor((udy+16)/8));};
      if (rollVx !== 0 && isWalkable(nx, py) && !bc(nx, py)) px = nx;
      if (rollVy !== 0 && isWalkable(px, ny) && !bc(px, ny)) py = ny;
      pMoving = true;
      rollTimer--; if (rollTimer <= 0) { pRolling = false; rollCooldown = 8; pMoving = false; }
    } else {
      if (rollCooldown > 0) rollCooldown--;
      var dx = 0, dy = 0;
      if (dpadState['left']) dx = -STEP; if (dpadState['right']) dx = STEP;
      if (dpadState['up']) dy = -STEP; if (dpadState['down']) dy = STEP;
      if (dx !== 0 && dy !== 0) { dx = dx < 0 ? -DIAG_STEP : DIAG_STEP; dy = dy < 0 ? -DIAG_STEP : DIAG_STEP; }
      if (dx !== 0 && dy !== 0 && lastDir) pDir = dirNameToPDir[lastDir];
      else if (dx < 0) pDir = 1;
      else if (dx > 0) pDir = 2;
      else if (dy < 0) pDir = 3;
      else if (dy > 0) pDir = 0;
      if (dx !== 0 || dy !== 0) {
        var nx = px + dx, ny = py + dy;
        var bc = function(gx,gy){var t=Math.floor((gx+19)/8),u=Math.floor((gy+16)/8);return (t===npcTileX&&u===npcTileY)||(t===Math.floor((udx+19)/8)&&u===Math.floor((udy+16)/8));};
        if (dx !== 0 && isWalkable(nx, py) && !bc(nx, py)) px = nx;
        if (dy !== 0 && isWalkable(px, ny) && !bc(px, ny)) py = ny;
        pMoving = true;
        if (tick % 2 === 0) pWalk++;
      } else { pMoving = false; pWalk = 0; }
    }
    px = Math.max(0, Math.min(WORLD_W - 38, px));
    py = Math.max(0, Math.min(WORLD_H - 42, py));
  }
  checkNearbyTriggers(px, py);
  updateNPC();
  updateUdayan();
  render();
  renderNPC();
  renderUdayan();
  renderBoat();
}

var bgm = document.getElementById('bgm');
var bgmStarted = false;
function startBGM() {
  if (bgmStarted) return;
  bgmStarted = true;
  bgm.volume = 0.35;
  bgm.play().catch(function(){});
  document.removeEventListener('keydown', startBGM);
  document.removeEventListener('click', startBGM);
  document.removeEventListener('touchend', startBGM);
}
document.addEventListener('keydown', startBGM);
document.addEventListener('click', startBGM);
document.addEventListener('touchend', startBGM);

var audioMuted = false;
document.getElementById('settingsBtn').addEventListener('click', function() {
  this.classList.add('active');
  setTimeout(function() { document.getElementById('settingsBtn').classList.remove('active'); }, 150);
  showSettingsOverlay();
});
document.getElementById('rollBtn').addEventListener('click', function() {
  this.classList.add('active');
  setTimeout(function() { document.getElementById('rollBtn').classList.remove('active'); }, 150);
  if (!pRolling && rollCooldown <= 0 && !gamePaused && !navPaused && !isRiding) {
    var sx = 0, sy = 0;
    if (dpadState['left']) sx = -ROLL_STEP; if (dpadState['right']) sx = ROLL_STEP;
    if (dpadState['up']) sy = -ROLL_STEP; if (dpadState['down']) sy = ROLL_STEP;
    if (sx !== 0 && sy !== 0) { sx = sx < 0 ? -ROLL_DIAG : ROLL_DIAG; sy = sy < 0 ? -ROLL_DIAG : ROLL_DIAG; }
    if (sx !== 0 || sy !== 0) { rollVx = sx; rollVy = sy; pRolling = true; rollTimer = 8; pMoving = true; if (sy < 0) pDir = 3; else if (sy > 0) pDir = 0; else if (sx < 0) pDir = 1; else if (sx > 0) pDir = 2; }
  }
});

initCollision(function() {
  loadTriggers(function() {
    if (!isWalkable(px, py)) {
      var n = findNearestWalkable(px, py);
      px = n.x; py = n.y;
      if (!isWalkable(px, py)) {
        for (var yy = -19; yy <= 19; yy += 8)
          for (var xx = -22; xx <= 22; xx += 8)
            if (isWalkable(144 + xx, 194 + yy)) { px = 144 + xx; py = 194 + yy; yy = 999; break; }
      }
    }
    npcInit();
    udayanInit();
    initBoat();
    render();
    setTimeout(function() {
      window.parent.postMessage({ type: 'hyvmind-loaded' }, '*');
    }, 300);
    setInterval(loop, 40);
    requestAnimationFrame(function() { document.body.focus(); });
    console.log('HYVMIND DEBUG: triggers=' + triggerPositions.length + ' doors=' + doorPositions.length + ' triggerMessages=' + Object.keys(triggerMessages).length + ' doorLabels=' + Object.keys(doorLabels).length + ' boatTerminalCenter=' + (boatTerminalCenter ? boatTerminalCenter.tx+','+boatTerminalCenter.ty : 'none') + ' nearTrigger=' + (nearTrigger ? nearTrigger.key : 'null'));
  });
});

// Reload collision data without page refresh
function reloadCollisionData() {
  var oldPx = px, oldPy = py;
  var img = new Image();
  img.onload = function() {
    try {
      var c = document.createElement('canvas');
      c.width = COLS; c.height = ROWS;
      var cx = c.getContext('2d', { willReadFrequently: true });
      cx.drawImage(img, 0, 0);
      var data = cx.getImageData(0, 0, COLS, ROWS).data;
      for (var y = 0; y < ROWS; y++)
        for (var x = 0; x < COLS; x++) {
          var idx = (y * COLS + x) * 4;
          var r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
          if (a === 0) collisionMap[y][x] = 0;
          else if (r > 150 && b > 150 && g < 150) collisionMap[y][x] = 4;
          else if (g > 150 && b > 150 && r < 150) collisionMap[y][x] = 5;
          else if (g > 150 && r < 150) collisionMap[y][x] = 1;
          else if (b > 150 && r < 150 && g < 150) collisionMap[y][x] = 6;
          else collisionMap[y][x] = 0;
        }
    } catch(e) { console.error('reloadCollision decode error:', e); }
    // Build positions from refreshed collision map
    triggerPositions = [];
    doorPositions = [];
    for (var y = 0; y < ROWS; y++)
      for (var x = 0; x < COLS; x++) {
        if (collisionMap[y][x] === 4) triggerPositions.push({tx: x, ty: y, key: x+','+y});
        if (collisionMap[y][x] === 6) doorPositions.push({tx: x, ty: y, key: x+','+y});
      }
    fetch(ASSETS + '/triggers.json')
      .then(function(r) { return r.json(); })
      .then(function(d) { triggerMessages = d || {}; udayanInit(); })
      .catch(function() { triggerMessages = {}; udayanInit(); })
      .then(function() {
        return fetch(ASSETS + '/doors.json');
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        doorLabels = d || {};
        scanBoatTriggers();
        if (isRiding) { isRiding = false; }
        initBoat();
        px = oldPx; py = oldPy;
        closePopup();
        console.log('MAP RELOADED: triggers=' + triggerPositions.length + ' doors=' + doorPositions.length + ' triggerMessages=' + Object.keys(triggerMessages).length + ' doorLabels=' + Object.keys(doorLabels).length);
      })
      .catch(function(e) { console.error('MAP RELOAD FAILED:', e); });
  };
  img.onerror = function() { console.error('reloadCollision img load failed'); };
  img.src = ASSETS + '/collision.png';
}

// Auto-poll for map changes every 3 seconds
var lastMapSize = 0;
function pollMapUpdate() {
  fetch(ASSETS + '/collision.png?' + Date.now(), { method: 'HEAD' })
    .then(function(r) {
      var size = parseInt(r.headers.get('Content-Length')) || 0;
      if (lastMapSize !== 0 && size !== 0 && size !== lastMapSize) {
        console.log('MAP CHANGE DETECTED: size=' + size + ' (was ' + lastMapSize + '), reloading...');
        reloadCollisionData();
      }
      if (size !== 0) lastMapSize = size;
    })
    .catch(function() {});
}
setInterval(pollMapUpdate, 3000);
