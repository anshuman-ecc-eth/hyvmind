<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool sprites preview — 32x32 detailed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1f; min-height: 100vh; display: flex;
    align-items: center; justify-content: center; gap: 44px; padding: 40px; flex-wrap: wrap;
    font-family: 'Courier New', monospace;
  }
  .cell { text-align: center; }
  .cell .sprite {
    width: 128px; height: 128px; image-rendering: pixelated;
    background: repeating-conic-gradient(#3a3a40 0% 25%, #2c2c31 0% 50%) 0 0 / 16px 16px;
    border: 2px solid #666; box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
  }
  .cell .sprite img { width: 96px; height: 96px; image-rendering: pixelated; }
  .cell .label { margin-top: 14px; color: #fff; font-size: 16px; letter-spacing: 0.12em; }
  .cell .note { margin-top: 4px; color: #999; font-size: 12px; }
</style>
</head>
<body>
  <div class="cell"><div class="sprite"><img src="/assets/voxel/tools/spade.png" width="96" height="96"></div><div class="label">SPADE</div><div class="note">shovel · stone (voxelworld)</div></div>
  <div class="cell"><div class="sprite"><img src="/assets/voxel/tools/brush.png" width="96" height="96"></div><div class="label">BRUSH</div><div class="note">shovel · iron (voxelworld)</div></div>
  <div class="cell"><div class="sprite"><img src="/assets/voxel/tools/weight.png" width="96" height="96"></div><div class="label">WEIGHT</div><div class="note">axe · stone (voxelworld)</div></div>
  <div class="cell"><div class="sprite"><img src="/assets/voxel/tools/shield.png" width="96" height="96"></div><div class="label">SHIELD</div><div class="note">axe · rainbow (voxelworld)</div></div>
</body>
</html>
