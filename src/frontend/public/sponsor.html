<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyvmind Sponsor</title>
  <script>
    (function() {
      var theme = localStorage.getItem("hyvmind-theme");
      var isLight = theme && theme.endsWith("-light");
      if (isLight) document.documentElement.classList.add("light");

      function swapLogo() {
        var logo = document.getElementById("sponsor-logo");
        if (logo) {
          logo.src = isLight ? "/assets/hyvmind_logo_light.png" : "/assets/hyvmind_logo_dark.png";
        }
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", swapLogo);
      } else {
        swapLogo();
      }

      window.addEventListener("storage", function(e) {
        if (e.key === "hyvmind-theme") {
          isLight = e.newValue && e.newValue.endsWith("-light");
          document.documentElement.classList.toggle("light", isLight);
          swapLogo();
        }
      });
    })();
  </script>
  <style>
    @font-face {
      font-family: "Ubuntu Sans";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url("/fonts/ubuntu-sans.woff2") format("woff2");
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Ubuntu Sans", sans-serif;
      background: #000;
      color: #fff;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      font-variant-ligatures: none;
    }
    html.light body {
      background: #fff;
      color: #1a1a1a;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Top bar — matches app header pattern */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 44px;
      display: flex;
      align-items: center;
      background: #000;
      border-bottom: 1px dashed oklch(20% 0 0);
    }
    .top-bar .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .top-bar .logo { height: 20px; object-fit: contain; }
    .top-bar .back-link {
      font-size: 0.75rem;
      color: oklch(65% 0 0);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }
    .top-bar .back-link:hover { color: #fff; }

    /* Main content */
    .content {
      padding: 100px 0 60px;
      text-align: center;
    }
    .content .message {
      font-size: 1.1rem;
      color: #fff;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 40px;
    }
    .content .message em {
      font-style: normal;
      color: oklch(70% 0.15 145);
    }
    .content .qr {
      display: block;
      max-width: 320px;
      width: 100%;
      height: auto;
      margin: 0 auto;
      border: 1px dashed oklch(20% 0 0);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 32px 0 48px;
      font-size: 0.7rem;
      color: oklch(65% 0 0);
    }
    .footer a { color: oklch(65% 0 0); text-decoration: none; }
    .footer a:hover { color: #fff; }

    /* Light mode overrides */
    html.light body { background: #fff; color: #1a1a1a; }
    html.light .top-bar { background: #fff; border-bottom-color: #d4d4d4; }
    html.light .top-bar .back-link { color: #666; }
    html.light .top-bar .back-link:hover { color: #000; }
    html.light .content .message { color: #1a1a1a; }
    html.light .content .message em { color: #2e7d32; }
    html.light .content .qr { border-color: #d4d4d4; }
    html.light .footer { color: #666; }
    html.light .footer a { color: #666; }
    html.light .footer a:hover { color: #000; }

    @media (max-width: 768px) {
      .content { padding: 80px 0 40px; }
      .content .message { font-size: 1rem; }
      .content .qr { max-width: 240px; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="container">
      <img src="/assets/hyvmind_logo_dark.png" alt="hyvmind" class="logo" id="sponsor-logo" />
      <a href="/" class="back-link">&larr; Back to app</a>
    </div>
  </header>

  <!-- Content -->
  <div class="container">
    <div class="content">
      <p class="message">
        Thanks for helping sustain this project.
      </p>
      <img src="/sponsor-qr.jpg" alt="UPI QR Code" class="qr" />
      <p class="message" style="margin-top: 40px;">
        Kindly add the following note to your transaction so we can keep track:
        <em>'Hyvmind Sponsor'</em>.
      </p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <a href="/">hyvmind.app</a> &middot; Sponsor
    </div>
  </footer>

</body>
</html>
