<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphite Test Rig</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #stage { width: 100%; height: 100%; }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div id="stage">
  <iframe id="v" src="/assets/voxel/voxel-world.html?seed=Test Map" title="Voxel World"></iframe>
</div>
<script>
  const iframe = document.getElementById('v');
  window.addEventListener('message', (e) => {
    if (e.source !== iframe.contentWindow) return;
    const d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'hyvmind-terrain-ready') {
      iframe.contentWindow.postMessage({ type: 'hyvmind-voxel-score', score: 1000 }, '*');
    }
  });
</script>
</body>
</html>
