[package]
name = "backend"
version = "0.1.0"

[build]
outputDir = "src/backend/dist"
args = [ "--release" ]

[canisters.backend]
main = "src/backend/main.mo"

[toolchain]
moc = "1.3.0"
lintoko = "0.7.0"

[lint]
extends = true

[moc]
args = [
  "--default-persistent-actors",
  "--actor-idl=src/backend/system-idl",
  "--implicit-package=core",
  "-no-check-ir",
  "-E=M0236,M0235,M0223,M0237",
  "-A=M0198"
]
version = "1.8.2"

[dependencies]
core = "2.2.0"
caffeineai-authorization = "0.1.0"
# base pinned for the vendored libsecp256k1 (src/backend/vendor, needs Buffer.toVarArray) and sha3.
base = "https://github.com/dfinity/motoko-base#f8112331eb94dcea41741e59c7e2eaf367721866"
sha3 = "https://github.com/hanbu97/motoko-sha3#v0.1.1"
